<!://><html lang="en"><head><title>P</title><style>
:root{--b:#0f172a;--s:#1e293b;--p:#2563eb}*{box-sizing:border-box;margin:0;padding:0;font-family:sans-serif;font-size:10px}
body{background:var(--b);color:#fff;height:100vh;display:flex;justify-content:center;align-items:center}
.a{background:var(--s);border-radius:6px;padding:12px;text-align:center;width:220px}
.c{background:var(--b);padding:4px;border:1px dashed #f59e0b;color:#f59e0b;font-weight:bold;margin:5px 0}
.i{width:100%;padding:4px;border-radius:4px;border:1px solid #334155;background:var(--b);color:#fff;text-align:center;margin-bottom:6px}
.w{display:grid;grid-template-columns:1fr 1fr;gap:6px;width:100%;max-width:720px;display:none;height:360px}.w.det{grid-template-columns:1fr}.w.det .cv{display:none}
.p{background:var(--s);border-radius:6px;padding:6px;display:flex;flex-direction:column;height:100%}
.h{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #334155;padding-bottom:2px;margin-bottom:4px}
.r{display:grid;grid-template-columns:1fr 130px;gap:4px;flex-grow:1;overflow:hidden}
.t{display:grid;grid-template-columns:repeat(auto-fill,minmax(55px,1fr));gap:2px;overflow-y:auto;align-content:start}
.b{background:#334155;border-radius:3px;padding:4px 1px;text-align:center;cursor:pointer}
.b div:last-child{color:#38bdf8;font-weight:bold}
.m{display:flex;flex-direction:column;background:var(--b);border-radius:4px;padding:4px;border:1px solid #334155}
.f{flex-grow:1;overflow-y:auto}.x{display:flex;justify-content:space-between}
.d{background:#020617;border-radius:4px;padding:4px;height:140px;display:flex;flex-direction:column;position:relative;overflow:hidden;align-items:center;justify-content:center}
.k{margin-top:4px;display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.o{background:#1a202c;border:1px solid #334155;color:#64748b;padding:4px 0;border-radius:4px;cursor:not-allowed;opacity:.3;text-align:center;font-weight:bold}
.o.e{cursor:pointer;opacity:1;color:#fff;border-color:var(--p)}
.v{background:#fff;width:100%;height:65px;display:none}#cv{background:#fff;width:100%;height:48px;cursor:crosshair;display:block}
.lp{background:#fff;color:#000;font-family:monospace;padding:3px;width:100%;margin-top:4px;display:none;max-height:80px;overflow-y:auto;font-size:8px}
.n{border:2px solid rgba(255,255,255,.1);width:12px;height:12px;border-radius:50%;border-left-color:var(--p);animation:s .8s linear infinite;display:none}
@keyframes s{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}
.btn{background:var(--p);color:#fff;border:none;padding:3px 6px;border-radius:3px;cursor:pointer}
.btn:disabled{opacity:.3}body.cst{background:var(--b);padding:4px}body.cst .thm{width:100%;height:100%}
</style></head><body>
    <div class="a" id="gs"><h3>Provision</h3><div class="c">8888-9999</div><input type="text" class="i" id="ai" placeholder="0000-0000" maxlength="9"><button class="btn" style="width:100%" onclick="v()">Activate</button></div>
    <div class="w" id="mr">
        <div class="p"><div class="h"><h3>Cashier</h3><div><button class="btn" style="background:#475569;margin-right:5px" onclick="oTab()">Tab</button><button class="btn" style="background:#ef4444" onclick="cl()">Void</button></div></div><div class="r"><div class="t" id="ca"></div><div class="m"><div class="f" id="cb">Empty</div><div style="border-top:1px dashed #334155;padding-top:2px"><div class="x"><span>Total</span><span style="font-weight:bold;color:#f59e0b" id="lt">\$0.00</span></div><button class="btn" id="bt" style="width:100%;margin-top:2px" onclick="tx()" disabled>Pay</button></div></div></div></div>
        <div class="p cv"><div class="h"><h3>Terminal</h3></div><div id="tt" style="height:100%"></div></div>
    </div>
    <template id="tm">
        <div class="thm" style="background:#2d3748;border-radius:8px;padding:6px;display:flex;flex-direction:column;height:100%"><div class="d"><div id="ht" style="font-weight:bold">Secure</div><div id="st" style="color:#64748b">Unprovisioned</div><div class="n" id="sp"></div><div id="tg" style="display:none;grid-template-columns:repeat(2,1fr);gap:2px;width:100%;margin-top:2px"></div><div class="v" id="vb"><canvas id="cv"></canvas><div style="display:flex;justify-content:space-between;background:#e2e8f0;padding:1px"><button onclick="cc()">Clear</button><button onclick="cs()" style="background:var(--p);color:#fff">OK</button></div></div></div><div class="k"><div class="o" id="w1" onclick="hw('TAP')">Tap</div><div class="o" id="w2" onclick="hw('CHIP')">Chip</div><div class="o" id="w3" onclick="hw('MSR')">Swipe</div></div><div class="lp" id="ro"></div></div>
    </template>
<script>
const menu=[{n:'Steak',p:46},{n:'Salmon',p:32.5},{n:'Salad',p:12},{n:'Mac',p:14.5}],c=[],isC=window.location.search.includes('c'),ctx=new(window.AudioContext||window.webkitAudioContext)();
let gt=0,pl=null,cv,cx,dr=false;
function bp(f,d,s="sine"){try{let o=ctx.createOscillator(),g=ctx.createGain();o.type=s;o.frequency.value=f;g.gain.value=.01;o.connect(g);g.connect(ctx.destination);o.start();o.stop(ctx.currentTime+d)}catch(e){}}
if(isC){
    document.getElementById('gs').style.display=document.getElementById('mr').style.display='none';document.body.className='cst';
    document.body.appendChild(document.getElementById('tm').content.cloneNode(true));iCn();
    window.addEventListener('storage',e=>{if(e.key==='p_shk')sSync()});sSync();
}else{
    document.getElementById('tt').appendChild(document.getElementById('tm').content.cloneNode(true));
    document.getElementById('ca').innerHTML=menu.map((i,x)=>`<div class="b" onclick="add(${x})"><div>${i.n}</div><div>$${i.p}</div></div>`).join('');iCn();localStorage.removeItem('p_shk');
}
function v(){if(document.getElementById('ai').value==="8888-9999"){bp(880,.1);document.getElementById('gs').style.display='none';document.getElementById('mr').style.display='grid';eng({s:'READY'})}else bp(220,.2,"square")}
function oTab(){localStorage.setItem('p_shk',JSON.stringify({s:'READY'}));window.open(window.location.href+'?c=1','_blank');document.getElementById('mr').classList.add('det')}
function add(x){c.push(menu[x]);gt=c.reduce((a,c)=>a+c.p,0)*1.0825;document.getElementById('cb').innerHTML=c.map(i=>`<div class="x"><span>${i.n}</span><span>$${i.p}</span></div>`).join('');document.getElementById('lt').innerText=`$${gt.toFixed(2)}`;document.getElementById('bt').disabled=false}
function cl(){c.length=0;gt=0;document.getElementById('cb').innerText='Empty';document.getElementById('lt').innerText='\$0.00';document.getElementById('bt').disabled=true;eng({s:'READY'})}
function tx(){eng({s:'TIP',b:gt,m:c})}
function eng(p){pl=p;localStorage.setItem('p_shk',JSON.stringify(p));rTerm(p)}
function sSync(){let d=localStorage.getItem('p_shk');if(d)rTerm(JSON.parse(d))}
function rTerm(p){
    if(!p)return;let h=document.getElementById('ht'),s=document.getElementById('st'),sp=document.getElementById('sp'),tg=document.getElementById('tg'),vb=document.getElementById('vb'),ro=document.getElementById('ro');
    sp.style.display=tg.style.display=vb.style.display='none';s.style.display='block';['w1','w2','w3'].forEach(id=>document.getElementById(id).classList.remove('e'));
    if(p.s==='READY'){h.innerText="Welcome";s.innerText="Awaiting check..."}
    if(p.s==='TIP'){bp(587,.08);h.innerText="Tip?";s.innerText=`$${p.b.toFixed(2)}`;tg.style.display='grid';tg.innerHTML=[.15,.2,0].map(pct=>`<button style="padding:2px" onclick="aTip(${p.b*pct})">${pct?pct*100+'%':'No'}</button>`).join('')}
    if(p.s==='CARD'){bp(587,.08);h.innerText="Present Card";s.innerText=`$ ${(p.b+p.t).toFixed(2)}`;['w1','w2','w3'].forEach(id=>document.getElementById(id).classList.add('e'))}
    if(p.s==='PROC'){h.innerText="Authorizing...";s.innerText="Routing...";sp.style.display='block'}
    if(p.s==='SIG'){bp(587,.08);h.innerText="Sign Below";s.style.display='none';vb.style.display='block';cv.width=cv.parentElement.clientWidth;cx.lineWidth=1;cx.strokeStyle="#020617"}
    if(p.s==='DONE'){bp(880,.1);h.innerText="Approved";s.innerText="Settled.";ro.style.display='block';let sm=p.m?p.m.reduce((a,c)=>a+c.p,0):p.b;ro.innerHTML=c.map(i=>`<div class="x"><span>${i.n}</span><span>$${i.p}</span></div>`).join('')+`<hr><div class="x"><span>TAX</span><span>$ ${(sm*.0825).toFixed(2)}</span></div><div class="x"><span>TIP</span><span>$ ${(p.t||0).toFixed(2)}</span></div><div class="x"><span>TOTAL</span><span>$ ${(sm*1.0825+(p.t||0)).toFixed(2)}</span></div><center>METH: ${p.w}</center>`;ro.scrollTop=ro.scrollHeight}
}
function aTip(t){pl.t=t;pl.s='CARD';eng(pl)}
function hw(w){if(!pl||pl.s!=='CARD')return;pl.s='PROC';pl.w=w;eng(pl);setTimeout(()=>{pl.s='SIG';eng(pl)},800)}
function iCn(){
    cv=document.getElementById('cv');if(!cv)return;cx=cv.getContext('2d');
    let gP=e=>{let r=cv.getBoundingClientRect();let t=e.touches?e.touches:e;return[t.clientX-r.left,t.clientY-r.top]};
    let dW=e=>{if(!dr)return;let[x,y]=gP(e);cx.lineTo(x,y);cx.stroke()};
    let sT=e=>{dr=true;cx.beginPath();let[x,y]=gP(e);cx.moveTo(x,y)};
    cv.onmousedown=sT;cv.onmousemove=dW;window.onmouseup=()=>dr=false;
    cv.addEventListener('touchstart',e=>{sT(e);e.preventDefault()});cv.addEventListener('touchmove',e=>{dW(e);e.preventDefault()});window.addEventListener('touchend',()=>dr=false);
    document.getElementById('ai').oninput=e=>{let v=e.target.value.replace(/\D/g,'');if(v.length>4)v=v.slice(0,4)+'-'+v.slice(4,8);e.target.value=v};
}
function cc(){cx.clearRect(0,0,cv.width,cv.height)}function cs(){pl.s='DONE';eng(pl)}
</script></body></html>
