<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>POS Instant</title><style>
:root{--b:#0b0f19;--s:#131c2e;--p:#2563eb;--g:#f59e0b;--t:#f8fafc;--m:#64748b}*{box-sizing:border-box;margin:0;padding:0;font-family:sans-serif;font-size:12px}
body{background:var(--b);color:var(--t);height:100vh;display:flex;justify-content:center;align-items:center;padding:5px}
.gate{background:var(--s);border-radius:12px;padding:25px;text-align:center;width:290px;border:1px solid #22314d;box-shadow:0 20px 40px rgba(0,0,0,0.5)}
.tok{background:var(--b);padding:10px;border:1px dashed var(--g);color:var(--g);font-family:monospace;font-size:15px;font-weight:bold;margin:12px 0}
.in{width:100%;padding:10px;border-radius:6px;border:1px solid #22314d;background:var(--b);color:#fff;text-align:center;font-size:15px;margin-bottom:12px}
.wk{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%;max-width:920px;display:none;height:450px}
.pn{background:var(--s);border:1px solid #22314d;border-radius:12px;padding:12px;display:flex;flex-direction:column;height:100%}
.ph{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #22314d;padding-bottom:5px;margin-bottom:8px}
.rl{display:grid;grid-template-columns:1fr 180px;gap:8px;flex-grow:1;overflow:hidden}
.grd{display:grid;grid-template-columns:repeat(auto-fill,minmax(75px,1fr));gap:4px;overflow-y:auto;align-content:start}
.btn-m{background:#1e293b;border:1px solid #22314d;border-radius:4px;padding:8px 2px;text-align:center;cursor:pointer}
.btn-m div:last-child{color:#38bdf8;font-weight:bold}
.ct{display:flex;flex-direction:column;background:var(--b);border-radius:6px;padding:8px;border:1px solid #22314d}
.lines{flex-grow:1;overflow-y:auto}.row{display:flex;justify-content:space-between;padding:2px 0}
.scr{background:#05070f;border-radius:6px;padding:10px;height:180px;display:flex;flex-direction:column;position:relative;overflow:hidden;align-items:center;justify-content:center}
.k{margin-top:8px;display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.o{background:#1a202c;border:1px solid #22314d;color:var(--m);padding:8px 0;border-radius:4px;cursor:not-allowed;opacity:.4;text-align:center;font-weight:bold}
.o.active{cursor:pointer;opacity:1;color:#fff;border-color:var(--p)}
.v{background:#fff;width:100%;height:80px;display:none}#cv{background:#fff;width:100%;height:58px;cursor:crosshair;display:block}
.tape{background:#fff;color:#000;font-family:monospace;padding:6px;width:100%;margin-top:8px;display:none;max-height:110px;overflow-y:auto;font-size:10px}
.spn{border:2px solid rgba(255,255,255,.1);width:16px;height:16px;border-radius:50%;border-left-color:var(--p);animation:s .8s linear infinite;display:none}
@keyframes s{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}
.btn{background:var(--p);color:#fff;border:none;padding:6px 12px;border-radius:4px;cursor:pointer;font-weight:bold}
.btn:disabled{opacity:.4;cursor:not-allowed}
</style></head><body>
    <div class="gate" id="gw">
        <h3>Provision Unit</h3><div class="tok">KEY: 7777-1111</div>
        <input type="text" class="in" id="ai" placeholder="0000-0000" maxlength="9">
        <button class="btn" style="width:100%;padding:10px" onclick="auth()">Activate Node</button>
    </div>
    <div class="wk" id="mr">
        <div class="pn">
            <div class="ph"><h3>Cashier</h3><button class="btn" style="background:#ef4444" onclick="cl()">Void</button></div>
            <div class="rl"><div class="grd" id="ca"></div>
                <div class="ct"><div class="lines" id="cb">Empty</div>
                    <div style="border-top:1px dashed #22314d;padding-top:5px"><div class="row"><span>Total</span><span style="font-weight:bold;color:var(--g)" id="lt">\$0.00</span></div>
                        <button class="btn" id="bt" style="width:100%;margin-top:6px" onclick="tx()" disabled>Process</button>
                    </div>
                </div>
            </div>
        </div>
        <div class="pn"><div class="ph"><h3>Terminal</h3></div>
            <div style="background:#2d3748;border-radius:14px;padding:10px;height:100%;display:flex;flex-direction:column">
                <div class="scr"><div id="ht" style="font-weight:bold;font-size:13px">Secure Standby</div><div id="st" style="color:var(--m);font-size:11px">Awaiting transaction payload...</div><div class="spn" id="sp"></div><div id="tg" style="display:none;grid-template-columns:repeat(2,1fr);gap:4px;width:100%;margin-top:4px"></div>
                    <div class="v" id="vb"><canvas id="cv"></canvas><div style="display:flex;justify-content:space-between;background:#e2e8f0;padding:1px"><button onclick="cc()" style="font-size:9px">Clear</button><button onclick="cs()" style="font-size:9px;background:var(--p);color:#fff;padding:0 4px">Confirm</button></div></div>
                </div>
                <div class="k"><div class="o" id="w1" onclick="hw('TAP')">Tap</div><div class="o" id="w2" onclick="hw('CHIP')">Chip</div><div class="o" id="w3" onclick="hw('SWIPE')">Swipe</div></div>
                <div class="tape" id="ro"></div>
            </div>
        </div>
    </div>
<script>
const menu=[{n:'Steak',p:46},{n:'Salmon',p:32.5},{n:'Salad',p:12},{n:'Mac',p:14.5},{n:'Cake',p:10}],cart=[],ctx=new(window.AudioContext||window.webkitAudioContext)();
let gt=0,pl=null,cv,cx,dr=false;
function bp(f,d,s="sine"){try{let o=ctx.createOscillator(),g=ctx.createGain();o.type=s;o.frequency.value=f;g.gain.value=.01;o.connect(g);g.connect(ctx.destination);o.start();o.stop(ctx.currentTime+d)}catch(e){}}
window.onload=()=>{
    document.getElementById('ca').innerHTML=menu.map((i,x)=>`<div class="btn-m" onclick="add(${x})"><div>${i.n}</div><div>$${i.p}</div></div>`).join('');
    cv=document.getElementById('cv');cx=cv.getContext('2d');
    let gP=e=>{let r=cv.getBoundingClientRect(),t=e.touches?e.touches[0]:e;return[t.clientX-r.left,t.clientY-r.top]};
    let dW=e=>{if(!dr)return;let[x,y]=gP(e);cx.lineTo(x,y);cx.stroke()};
    let sT=e=>{dr=true;cx.beginPath();let[x,y]=gP(e);cx.moveTo(x,y)};
    cv.onmousedown=sT;cv.onmousemove=dW;window.onmouseup=()=>dr=false;
    cv.addEventListener('touchstart',e=>{sT(e);e.preventDefault()},{passive:false});cv.addEventListener('touchmove',e=>{dW(e);e.preventDefault()},{passive:false});window.addEventListener('touchend',()=>dr=false);
    document.getElementById('ai').oninput=e=>{let v=e.target.value.replace(/\D/g,'');if(v.length>4)v=v.slice(0,4)+'-'+v.slice(4,8);e.target.value=v};
};
function auth(){if(document.getElementById('ai').value==="7777-1111"){bp(880,.1);document.getElementById('gw').style.display='none';document.getElementById('mr').style.display='grid';eng({s:'READY'})}else bp(220,.2,"square")}
function add(x){cart.push(menu[x]);gt=cart.reduce((a,c)=>a+c.p,0)*1.0825;document.getElementById('cb').innerHTML=cart.map(i=>`<div class="row"><span>${i.n}</span><span>$${i.p}</span></div>`).join('');document.getElementById('lt').innerText=`$${gt.toFixed(2)}`;document.getElementById('bt').disabled=false}
function cl(){cart.length=0;gt=0;document.getElementById('cb').innerText='Empty';document.getElementById('lt').innerText='\$0.00';document.getElementById('bt').disabled=true;eng({s:'READY'})}
function tx(){eng({s:'TIP',b:gt})}
function eng(p){pl=p;let h=document.getElementById('ht'),s=document.getElementById('st'),sp=document.getElementById('sp'),tg=document.getElementById('tg'),vb=document.getElementById('vb'),ro=document.getElementById('ro');sp.style.display=tg.style.display=vb.style.display='none';s.style.display='block';['w1','w2','w3'].forEach(id=>document.getElementById(id).classList.remove('active'));
    if(p.s==='READY'){h.innerText="Welcome";s.innerText="Awaiting cashier ticket payload..."}
    if(p.s==='TIP'){bp(587,.08);h.innerText="Select Gratuity";s.innerText=`Bill: $${p.b.toFixed(2)}`;tg.style.display='grid';tg.innerHTML=[.15,.2,0].map(pct=>`<button style="padding:4px;font-size:10px" onclick="aTip(${p.b*pct})">${pct?pct*100+'%':'No'}</button>`).join('')}
    if(p.s==='CARD'){bp(587,.08);h.innerText="Present Card";s.innerText=`Total: $ ${(p.b+p.t).toFixed(2)}`;['w1','w2','w3'].forEach(id=>document.getElementById(id).classList.add('active'))}
    if(p.s==='PROC'){h.innerText="Authorizing...";s.innerText="Routing cryptogram packets...";sp.style.display='block'}
    if(p.s==='SIG'){bp(587,.08);h.innerText="Verify Parameters";s.style.display='none';vb.style.display='block';cv.width=cv.parentElement.clientWidth;cx.lineWidth=2;cx.lineCap="round";cx.strokeStyle="#05070f"}
    if(p.s==='DONE'){bp(880,.1);h.innerText="Approved";s.innerText="Settled successfully.";ro.style.display='block';for(let i=0;i<6;i++)setTimeout(()=>bp(Math.random()*300+120,.02,"square"),i*40);let sm=cart.reduce((a,c)=>a+c.p,0);ro.innerHTML=cart.map(i=>`<div class="row"><span>${i.n}</span><span>$${i.p}</span></div>`).join('')+`<hr><div class="row"><span>TAX</span><span>$ ${(sm*.0825).toFixed(2)}</span></div><div class="row"><span>TIP</span><span>$ ${p.t.toFixed(2)}</span></div><div class="row" style="font-weight:bold"><span>TOTAL</span><span>$ ${(sm*1.0825+p.t).toFixed(2)}</span></div><center><br>METHOD: ${p.w}<br>AUTH ID: ${Math.floor(Math.random()*8999+1000)}</center>`;ro.scrollTop=ro.scrollHeight}
}
function aTip(t){pl.t=t;pl.s='CARD';eng(pl)}
function hw(w){if(!pl||pl.s!=='CARD')return;pl.s='PROC';pl.w=w;eng(pl);setTimeout(()=>{pl.s='SIG';eng(pl)},1200)}
function cc(){cx.clearRect(0,0,cv.width,cv.height)}function cs(){pl.s='DONE';eng(pl)}
</script></body></html>
