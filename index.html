<!://><html lang="en"><head><title>POS</title><style>
:root{--b:#0f172a;--s:#1e293b;--p:#2563eb;--t:#f8fafc;--m:#64748b}*{box-sizing:border-box;margin:0;padding:0;font-family:sans-serif}
body{background:var(--b);color:var(--t);min-height:100vh;display:flex;justify-content:center;align-items:center;font-size:14px;padding:10px}
.a{background:var(--s);border:1px solid #334155;border-radius:16px;padding:30px;text-align:center;width:340px}
.c{background:var(--b);padding:10px;border:1px dashed #f59e0b;color:#f59e0b;font-family:monospace;font-weight:bold;margin:15px 0}
.i{width:100%;padding:10px;border-radius:8px;border:1px solid #334155;background:var(--b);color:#fff;text-align:center;margin-bottom:15px}
.w{display:grid;grid-template-columns:1fr 1fr;gap:20px;width:100%;max-width:1000px;display:none}
.p{background:var(--s);border:1px solid #334155;border-radius:14px;padding:15px;height:600px;display:flex;flex-direction:column}
.h{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;border-bottom:1px solid #334155;padding-bottom:10px}
.r{display:grid;grid-template-columns:1fr 220px;gap:12px;flex-grow:1;overflow:hidden}
.t{display:grid;grid-template-columns:repeat(auto-fill,minmax(85px,1fr));gap:6px;overflow-y:auto;align-content:start}
.b{background:#334155;border:1px solid #475569;border-radius:6px;padding:10px 4px;text-align:center;cursor:pointer}
.b div:last-child{color:#38bdf8;font-size:12px;font-weight:bold}
.m{display:flex;flex-direction:column;background:var(--b);border-radius:8px;padding:10px;border:1px solid #334155}
.f{flex-grow:1;overflow-y:auto;font-size:13px}.x{display:flex;justify-content:space-between;padding:4px 0}
.g{font-size:16px;font-weight:bold;color:#f59e0b}
.d{background:#020617;border-radius:8px;padding:15px;height:240px;display:flex;flex-direction:column;position:relative;overflow:hidden;align-items:center;justify-content:center}
.k{margin-top:12px;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.o{background:#1a202c;border:1px solid #334155;color:var(--m);padding:10px 0;border-radius:6px;cursor:not-allowed;opacity:.4;text-align:center;font-size:11px}
.o.e{cursor:pointer;opacity:1;color:#fff;border-color:var(--p)}
.v{background:white;width:100%;height:80px;display:none}#cv{background:white;width:100%;height:100%;cursor:crosshair}
.lp{background:white;color:black;font-family:monospace;padding:10px;width:100%;margin-top:12px;display:none;max-height:150px;overflow-y:auto;font-size:11px}
.n{border:3px solid rgba(255,255,255,.1);width:24px;height:24px;border-radius:50%;border-left-color:var(--p);animation:s .8s linear infinite;display:none}
@keyframes s{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}
.btn{background:var(--p);color:#fff;border:none;padding:8px 12px;border-radius:6px;cursor:pointer;font-weight:600}
</style></head><body>
    <div class="a" id="gs"><h3>Provision</h3><div class="c">8888-9999</div><input type="text" class="i" id="ai" placeholder="0000-0000" maxlength="9"><button class="btn" style="width:100%" onclick="v()">Activate</button></div>
    <div class="w" id="mr">
        <div class="p"><div class="h"><h3>Cashier</h3><button class="btn" style="background:#ef4444" onclick="cl()">Void</button></div><div class="r"><div class="t" id="ca"></div><div class="m"><div class="f" id="cb">Empty</div><div style="border-top:2px dashed #334155;padding-top:8px"><div class="x"><span>Total</span><span class="g" id="lt">\$0.00</span></div><button class="btn" id="bt" style="width:100%;margin-top:8px" onclick="tx()" disabled>Pay</button></div></div></div></div>
        <div class="p"><div class="h"><h3>Terminal</h3></div><div style="background:#2d3748;border-radius:20px;padding:15px;height:100%;display:flex;flex-direction:column"><div class="d"><div id="ht" style="font-weight:bold;font-size:15px">Secure</div><div id="st" style="color:var(--m);font-size:12px">Unprovisioned</div><div class="n" id="sp"></div><div id="tg" style="display:none;grid-template-columns:repeat(2,1fr);gap:6px;width:100%;margin-top:8px"></div><div class="v" id="vb"><canvas id="cv"></canvas><div style="display:flex;justify-content:space-between;background:#e2e8f0;padding:2px"><button onclick="cc()" style="font-size:9px">Clear</button><button onclick="cs()" style="font-size:9px;background:var(--p);color:#fff">Confirm</button></div></div></div><div class="k"><div class="o" id="w1" onclick="hw('TAP')">Tap</div><div class="o" id="w2" onclick="hw('CHIP')">Chip</div><div class="o" id="w3" onclick="hw('MSR')">Swipe</div></div><div class="lp" id="ro"></div></div></div>
    </div>
<script>
const menu=[{n:'Steak',p:46},{n:'Salmon',p:32.5},{n:'Salad',p:12},{n:'Mac',p:14.5},{n:'Cake',p:10}],c=[],ctx=new(window.AudioContext||window.webkitAudioContext)();
let gt=0,pl=null,cv,cx,dr=false;
function bp(f,d,s="sine"){try{let o=ctx.createOscillator(),g=ctx.createGain();o.type=s;o.frequency.value=f;g.gain.value=.04;o.connect(g);g.connect(ctx.destination);o.start();o.stop(ctx.currentTime+d)}catch(e){}}
window.onload=()=>{
    document.getElementById('ca').innerHTML=menu.map((i,x)=>`<div class="b" onclick="add(${x})"><div>${i.n}</div><div>$${i.p}</div></div>`).join('');
    cv=document.getElementById('cv');cx=cv.getContext('2d');
    cv.onmousedown=e=>{dr=true;cx.beginPath();let r=cv.getBoundingClientRect();cx.moveTo(e.clientX-r.left,e.clientY-r.top)};
    cv.onmousemove=e=>{if(!dr)return;let r=cv.getBoundingClientRect();cx.lineTo(e.clientX-r.left,e.clientY-r.top);cx.stroke()};
    window.onmouseup=()=>dr=false;
    document.getElementById('ai').oninput=e=>{let v=e.target.value.replace(/\D/g,'');if(v.length>4)v=v.slice(0,4)+'-'+v.slice(4,8);e.target.value=v};
};
function v(){if(document.getElementById('ai').value==="8888-9999"){bp(880,.1);document.getElementById('gs').style.display='none';document.getElementById('mr').style.display='grid';eng({s:'READY'})}else bp(220,.3,"square")}
function add(x){c.push(menu[x]);gt=c.reduce((a,c)=>a+c.p,0)*1.0825;document.getElementById('cb').innerHTML=c.map(i=>`<div class="x"><span>${i.n}</span><span>$${i.p}</span></div>`).join('');document.getElementById('lt').innerText=`$${gt.toFixed(2)}`;document.getElementById('bt').disabled=false}
function cl(){c.length=0;gt=0;document.getElementById('cb').innerText='Empty';document.getElementById('lt').innerText='\$0.00';document.getElementById('bt').disabled=true;eng({s:'READY'})}
function tx(){eng({s:'TIP',b:gt})}
function eng(p){
    pl=p;let h=document.getElementById('ht'),s=document.getElementById('st'),sp=document.getElementById('sp'),tg=document.getElementById('tg'),vb=document.getElementById('vb'),ro=document.getElementById('ro');
    sp.style.display=tg.style.display=vb.style.display='none';['w1','w2','w3'].forEach(id=>document.getElementById(id).classList.remove('e'));
    if(p.s==='READY'){h.innerText="Welcome";s.innerText="Awaiting check..."}
    if(p.s==='TIP'){bp(587,.08);h.innerText="Tip?";s.innerText=`Bill: $${p.b.toFixed(2)}`;tg.style.display='grid';tg.innerHTML=[.15,.2,0].map(pct=>`<button style="padding:6px;font-size:11px" onclick="aTip(${p.b*pct})">${pct?pct*100+'%':'No'}</button>`).join('')}
    if(p.s==='CARD'){bp(587,.08);h.innerText="Present Card";s.innerText=`Total: $ ${(p.b+p.t).toFixed(2)}`;['w1','w2','w3'].forEach(id=>document.getElementById(id).classList.add('e'))}
    if(p.s==='PROC'){h.innerText="Authorizing...";s.innerText="Routing cryptogram...";sp.style.display='block'}
    if(p.s==='SIG'){bp(587,.08);h.innerText="Sign Below";s.style.display='none';vb.style.display='block';cv.width=cv.parentElement.clientWidth;cx.lineWidth=2;cx.lineCap="round"}
    if(p.s==='DONE'){bp(880,.1);h.innerText="Approved";s.style.display='block';s.innerText="Settled.";ro.style.display='block';for(let i=0;i<6;i++)setTimeout(()=>bp(Math.random()*300+100,.02,"square"),i*40);ro.innerHTML=`<center><b>RECEIPT</b><br>${new Date().toLocaleTimeString()}<hr></center>`+c.map(i=>`<div class="x"><span>${i.n}</span><span>$${i.p}</span></div>`).join('')+`<hr><div class="x"><span>TIP</span><span>$${p.t.toFixed(2)}</span></div><div class="x"><span>TOTAL</span><span>$ ${(p.b+p.t).toFixed(2)}</span></div><center><br>METHOD: ${p.w}</center>`}
}
function aTip(t){pl.t=t;pl.s='CARD';eng(pl)}
function hw(w){if(!pl||pl.s!=='CARD')return;pl.s='PROC';pl.w=w;eng(pl);setTimeout(()=>{pl.s='SIG';eng(pl)},1200)}
function cc(){cx.clearRect(0,0,cv.width,cv.height)}function cs(){pl.s='DONE';eng(pl)}
</script></body></html>
